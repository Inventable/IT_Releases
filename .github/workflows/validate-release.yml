name: Validate release catalogue

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate release catalogue invariants
        shell: pwsh
        run: ./eng/Test-ReleaseRepository.ps1 -Root .
      - name: Reject committed release binaries
        shell: bash
        run: |
          if find . -type f -size +5M -not -path './.git/*' | grep -q .; then
            echo "Large files must be GitHub Release assets, not Git commits."
            exit 1
          fi
